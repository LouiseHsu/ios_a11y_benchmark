name: flutter_a11y_benchmark
description: "Flutter twin of the UIKit accessibility ruler benchmark app (uikit_a11y_benchmark)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.15.0-19.0.dev

# Only Flutter-team packages: package:flutter plus material_ui (Material is a
# separate first-party package on this SDK; package:flutter/material.dart is
# deprecated).
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
