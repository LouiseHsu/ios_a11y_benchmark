name: flutter_a11y_benchmark
description: "Flutter Cupertino twin of the UIKit accessibility ruler benchmark app (uikit_a11y_benchmark)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.15.0-19.0.dev

# Only Flutter-team packages: package:flutter plus cupertino_ui (Cupertino is a
# separate first-party package on this SDK; package:flutter/cupertino.dart is
# deprecated).
dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.1.4
  # Bundles the CupertinoIcons glyph font (chevrons, check mark, tab icons,
  # navigation-bar back button).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
